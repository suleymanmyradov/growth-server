# Based on the Uber Go Style Guide linting recommendations:
# https://github.com/uber-go/guide/blob/master/.golangci.yml
#
# Recommended linters at a minimum:
#   errcheck    - ensure errors are handled
#   goimports   - format code and manage imports
#   revive      - common style mistakes (modern successor to golint)
#   govet       - common mistakes analysis
#   staticcheck - various static analysis checks

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - goimports

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
  # go-zero config structs use non-standard `json` tag options like
  # `json:"...,optional"` and `json:"...,default=60,5"` which go-zero's config
  # loader recognizes but staticcheck (SA5008) does not. staticcheck emits
  # several variants for these (unknown `optional`, unknown `default`,
  # unknown `5`, malformed `json` tag, ...) — all false positives. Every SA5008
  # hit in this codebase is a go-zero config struct tag, so SA5008 is suppressed
  # globally. If a real invalid-tag bug is introduced elsewhere, govet's
  # fieldalignment/tagliatelle or a review should catch it.
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA5008"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
