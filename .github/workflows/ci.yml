# CI/CD for growth-server.
#
# PRs: build + test + lint + table-ownership check.
# Push to main: the same checks gate an image build for every service
# (pushed to GHCR tagged sha-<commit> and latest), followed by an SSH deploy
# to the production VM (pull → migrate → recreate → health checks).
#
# Rollback: on the VM run
#   BACKEND_TAG=sha-<sha> docker compose -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod --profile admin up -d --no-deps <services>

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}-

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
      # make check-types-api-sync is intentionally excluded: pre-existing
      # types.api drift between gateway and ai-gateway on main.
      - run: make check-ownership

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth,               path: ./services/microservices/auth/rpc }
          - { service: client,             path: ./services/microservices/client/rpc }
          - { service: search,             path: ./services/microservices/search/rpc }
          - { service: ai-coach,           path: ./services/microservices/ai-coach/rpc }
          - { service: filemanager,        path: ./services/microservices/filemanager/rpc }
          - { service: notifications,      path: ./services/microservices/notifications/rpc }
          - { service: ai-coach-consumer,  path: ./services/microservices/ai-coach-consumer }
          - { service: search-sync,        path: ./services/microservices/search-sync }
          - { service: analytics-consumer, path: ./services/microservices/analytics-consumer }
          - { service: gateway,            path: ./services/gateway/growth }
          - { service: ai-gateway,         path: ./services/ai-gateway/aiapi }
          - { service: adminway,           path: ./services/adminway/adminapi }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.golang
          push: true
          provenance: false
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
          tags: |
            ${{ env.IMAGE_PREFIX }}${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrate
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}migrations:latest
            ${{ env.IMAGE_PREFIX }}migrations:sha-${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Let the VM pull this repo's (possibly private) GHCR images.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "docker login $REGISTRY -u '${{ github.actor }}' --password-stdin" >/dev/null
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" 'bash -s' < deploy/deploy.sh
      - name: Make GHCR images public (free storage for public repo)
        if: success()
        continue-on-error: true
        run: |
          for svc in auth client search ai-coach filemanager notifications ai-coach-consumer search-sync analytics-consumer gateway ai-gateway adminway migrations; do
            gh api -X PATCH "/user/packages/container/growth-server-$svc" -f visibility=public >/dev/null 2>&1 || true
          done
      - name: Prune old image versions (keep 3)
        if: always()
        continue-on-error: true
        run: |
          for svc in auth client search ai-coach filemanager notifications ai-coach-consumer search-sync analytics-consumer gateway ai-gateway adminway migrations; do
            gh api --paginate "/user/packages/container/growth-server-$svc/versions" --jq '.[].id' 2>/dev/null \
              | tail -n +4 \
              | while read -r id; do gh api -X DELETE "/user/packages/container/growth-server-$svc/versions/$id" || true; done
          done
