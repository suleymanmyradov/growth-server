root = "."
tmp_dir = "tmp/air-ai-coach-consumer"

[build]
cmd = "go build -o ./bin/ai-coach-consumer ./services/microservices/ai-coach-consumer"
entrypoint = ["./bin/ai-coach-consumer", "-f", "services/microservices/ai-coach-consumer/etc/ai-coach.yaml"]
include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
include_dir = ["services/microservices/ai-coach-consumer", "pkg"]
exclude_dir = ["tmp", "bin", "logs", "deploy", "docs", "sql", "scripts", "vendor", "testdata", "node_modules"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
