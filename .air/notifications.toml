root = "."
tmp_dir = "tmp/air-notifications"

[build]
cmd = "go build -o ./bin/notifications ./services/microservices/notifications/rpc"
entrypoint = ["./bin/notifications", "-f", "services/microservices/notifications/rpc/etc/notifications.yaml"]
include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
include_dir = ["services/microservices/notifications", "pkg"]
exclude_dir = ["tmp", "bin", "logs", "deploy", "docs", "sql", "scripts", "vendor", "testdata", "node_modules"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
