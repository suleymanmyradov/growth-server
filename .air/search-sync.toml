root = "."
tmp_dir = "tmp/air-search-sync"

[build]
cmd = "go build -o ./bin/search-sync ./services/microservices/search-sync"
entrypoint = ["./bin/search-sync", "-f", "services/microservices/search-sync/etc/search-sync.yaml"]
include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
include_dir = ["services/microservices/search-sync", "pkg"]
exclude_dir = ["tmp", "bin", "logs", "deploy", "docs", "sql", "scripts", "vendor", "testdata", "node_modules"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
