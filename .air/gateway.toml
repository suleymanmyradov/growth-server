root = "."
tmp_dir = "tmp/air-gateway"

[build]
cmd = "go build -o ./bin/gateway ./services/gateway/growth"
entrypoint = ["./bin/gateway", "-f", "services/gateway/growth/etc/growthapi.yaml"]
include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
include_dir = ["services/gateway", "pkg"]
exclude_dir = ["tmp", "bin", "logs", "deploy", "docs", "sql", "scripts", "vendor", "testdata", "node_modules"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
