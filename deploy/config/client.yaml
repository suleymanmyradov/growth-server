# Production client RPC service configuration.

Name: client.rpc
ListenOn: 0.0.0.0:9082
Timeout: 30000

Postgres:
  Datasource: ${POSTGRES_DATASOURCE}
  MaxOpenConns: 25
  MaxIdleConns: 5
  ConnMaxLifetime: 5m

Telemetry:
  Name: client.rpc
  Endpoint: tempo:4317
  Sampler: 0.3
  Batcher: otlpgrpc

Kafka:
  Brokers:
    - redpanda:9092
  EventsTopic: growth.events
  ConsumerGroup: client

AppRedis:
  Addr: redis:6379
  DB: 0
  Password: ${REDIS_PASSWORD}

JWT:
  # Verify-only: public key of the auth service's ES256 pair. This service
  # cannot mint tokens.
  PublicKey: "${JWT_PUBLIC_KEY}"
  # Legacy HS256 fallback — dual-verify migration window only.
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Billing:
  Mode: ${BILLING_MODE}
  StripeSecretKey: ${STRIPE_SECRET_KEY}
  StripeWebhookSecret: ${STRIPE_WEBHOOK_SECRET}
  FrontendURL: ${APP_URL}
  Paddle:
    Enabled: ${PADDLE_ENABLED}
    Environment: ${PADDLE_ENVIRONMENT}
    APIKey: ${PADDLE_API_KEY}
    WebhookSecret: ${PADDLE_WEBHOOK_SECRET}

WeeklyReview:
  RegenerationCooldown: 1s

Log:
  ServiceName: client
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9105
  Path: /metrics

# Liveness probe server (go-zero DevServer) — compose healthcheck hits
# /healthz. Metrics are served by the Prometheus agent above; pprof stays off.
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9205
  HealthPath: /healthz
  HealthResponse: ok
  EnableMetrics: false
  EnablePprof: false
