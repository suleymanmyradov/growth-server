# Production ai-gateway configuration.
# Values with ${VAR} are resolved from environment variables at startup.

Name: ai-gateway
Host: 0.0.0.0
Port: 8889

MaxConns: 5000
MaxBytes: 26214400
Timeout: 300000

Middlewares:
  Trace: true
  Log: true
  Prometheus: true
  MaxConns: true
  Breaker: true
  Shedding: true
  Timeout: true
  Recover: true
  Metrics: true
  MaxBytes: true
  Gunzip: true

AuthRpc:
  Endpoints:
    - auth:9081
  NonBlock: true

ClientRpc:
  Endpoints:
    - client:9082
  NonBlock: true

AICoachRpc:
  Endpoints:
    - ai-coach:9086
  NonBlock: true

SearchRpc:
  Endpoints:
    - search:9083
  NonBlock: true

Auth:
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

AI:
  api_key: ${AI_API_KEY}
  base_url: ${AI_BASE_URL}
  default_timeout: 240s
  max_retries: 3
  retry_backoff: 500ms
  http_referer: ${APP_URL}
  x_title: growth
  models:
    cheap: ${AI_MODEL_CHEAP}
    cheap_long: ${AI_MODEL_CHEAP_LONG}
    classifier: ${AI_MODEL_CLASSIFIER}
    chat: ${AI_MODEL_CHAT}
    fallback: ${AI_MODEL_FALLBACK}
  fallback_policy:
    enabled: true
    max_failures: 2
  fallback_providers:
    - api_key: ${AI_API_KEY}
      base_url: ${AI_BASE_URL}
      models:
        cheap: ${AI_FB1_CHEAP}
        cheap_long: ${AI_FB1_CHEAP_LONG}
        classifier: ${AI_FB1_CLASSIFIER}
        chat: ${AI_FB1_CHAT}
        fallback: ${AI_FB1_FALLBACK}
    - api_key: ${AI_API_KEY}
      base_url: ${AI_BASE_URL}
      models:
        cheap: ${AI_FB2_CHEAP}
        cheap_long: ${AI_FB2_CHEAP_LONG}
        classifier: ${AI_FB2_CLASSIFIER}
        chat: ${AI_FB2_CHAT}
        fallback: ${AI_FB2_FALLBACK}
    - api_key: ${AI_API_KEY}
      base_url: ${AI_BASE_URL}
      models:
        cheap: ${AI_FB3_CHEAP}
        cheap_long: ${AI_FB3_CHEAP_LONG}
        classifier: ${AI_FB3_CLASSIFIER}
        chat: ${AI_FB3_CHAT}
        fallback: ${AI_FB3_FALLBACK}
  # Per-1K-token USD rates, deliberately OVERestimated so the internal cost
  # counter runs ahead of real Google AI Studio billing and the global cap
  # trips before real spend reaches it.
  cost_rates:
    gemini-flash-latest:
      prompt_per_1k: 0.0003
      completion_per_1k: 0.0025
    gemini-flash-lite-latest:
      prompt_per_1k: 0.0001
      completion_per_1k: 0.0005
    gemini-3.1-flash-lite:
      prompt_per_1k: 0.0001
      completion_per_1k: 0.0005
    gemini-3.5-flash-lite:
      prompt_per_1k: 0.0001
      completion_per_1k: 0.0005
    gemini-3.5-flash:
      prompt_per_1k: 0.0003
      completion_per_1k: 0.0025
    gemini-3-flash-preview:
      prompt_per_1k: 0.0003
      completion_per_1k: 0.0025
    gemma-4-31b-it:
      prompt_per_1k: 0.0001
      completion_per_1k: 0.0005
  # Hard spend guardrails: per-user daily token cap + platform-wide daily
  # cost cap. Checks fail CLOSED (Redis down = AI calls blocked).
  quota:
    redis_addr: redis:6379
    redis_password: ${REDIS_PASSWORD}
    redis_db: 0
    user_daily_token_cap: 1000000
    global_daily_cost_cap_usd: 5

Coaching:
  MaxSteps: 6
  MaxTotalTokens: 100000
  MaxTokens: 4096

RateLimit:
  Namespace: ai-gateway
  Redis:
    Host: redis:6379
    Type: node
    Pass: ${REDIS_PASSWORD}
  AuthQuota: "60,10"
  AIQuota: "60,10"
  SearchQuota: "60,30"

Telemetry:
  Name: ai-gateway
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc
