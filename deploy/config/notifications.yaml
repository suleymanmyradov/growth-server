# Production notifications RPC service configuration.

Name: notifications.rpc
ListenOn: 0.0.0.0:8080

Postgres:
  Datasource: ${POSTGRES_DATASOURCE}
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetime: 1800s

Kafka:
  Brokers:
    - redpanda:9092
  EventsTopic: growth.events
  ReminderDueTopic: growth.reminder.due
  ConsumerGroup: notifications

JWT:
  # Verify-only: public key of the auth service's ES256 pair.
  PublicKey: "${JWT_PUBLIC_KEY}"
  # Legacy HS256 fallback — dual-verify migration window only.
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

# Reminder/broadcast email delivery (habit reminders, digests). Verification
# email is sent by the auth service; this enables the notifications worker's
# own email channel via the same Resend account.
Email:
  Enabled: true
  Provider: resend
  APIKey: ${RESEND_API_KEY}
  FromAddress: ${EMAIL_FROM_ADDRESS}
  FrontendBaseURL: ${APP_URL}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Telemetry:
  Name: notifications.rpc
  Endpoint: tempo:4317
  Sampler: 0.3
  Batcher: otlpgrpc

Log:
  ServiceName: notifications
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9109
  Path: /metrics

# Liveness probe server (go-zero DevServer) — compose healthcheck hits
# /healthz. Metrics are served by the Prometheus agent above; pprof stays off.
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9209
  HealthPath: /healthz
  HealthResponse: ok
  EnableMetrics: false
  EnablePprof: false
