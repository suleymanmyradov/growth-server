# Production notifications RPC service configuration.

Name: notifications.rpc
ListenOn: 0.0.0.0:8080

Postgres:
  Datasource: ${POSTGRES_DATASOURCE}
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetime: 1800s

Kafka:
  Brokers:
    - redpanda:9092
  EventsTopic: growth.events
  ReminderDueTopic: growth.reminder.due
  ConsumerGroup: notifications

JWT:
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

# Reminder/broadcast email delivery (habit reminders, digests). Verification
# email is sent by the auth service; this enables the notifications worker's
# own email channel via the same Resend account.
Email:
  Enabled: true
  Provider: resend
  APIKey: ${RESEND_API_KEY}
  FromAddress: ${EMAIL_FROM_ADDRESS}
  FrontendBaseURL: ${APP_URL}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Telemetry:
  Name: notifications.rpc
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc
