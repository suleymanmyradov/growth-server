# Production filemanager RPC service configuration.

Name: filemanager.rpc
ListenOn: 0.0.0.0:9087

MinIO:
  Endpoint: minio:9000
  AccessKey: ${MINIO_ACCESS_KEY}
  SecretKey: ${MINIO_SECRET_KEY}
  UseSSL: false
  DefaultBucket: growthmind
  Region: us-east-1
  # Browser-reachable base for public object URLs (proxied by Caddy to minio:9000).
  PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL}

Telemetry:
  Name: filemanager.rpc
  Endpoint: tempo:4317
  Sampler: 0.3
  Batcher: otlpgrpc
ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Log:
  ServiceName: filemanager
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9108
  Path: /metrics

# Liveness probe server (go-zero DevServer) — compose healthcheck hits
# /healthz. Metrics are served by the Prometheus agent above; pprof stays off.
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9208
  HealthPath: /healthz
  HealthResponse: ok
  EnableMetrics: false
  EnablePprof: false
