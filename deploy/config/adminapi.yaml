# Production admin API configuration.

Name: admin-api
Host: 0.0.0.0
Port: 8890

MaxConns: 10000
MaxBytes: 10485760
Timeout: 30000

Middlewares:
  Trace: true
  Log: true
  Prometheus: true
  MaxConns: true
  Breaker: true
  Shedding: true
  Timeout: true
  Recover: true
  Metrics: true
  MaxBytes: true
  Gunzip: true

Postgres:
  Datasource: ${ADMIN_POSTGRES_DATASOURCE}
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetime: 5m

ClientRpc:
  Endpoints:
    - client:9082
  NonBlock: true

FileManagerRpc:
  Endpoints:
    - filemanager:9087
  NonBlock: true

SearchRpc:
  Endpoints:
    - search:9083
  NonBlock: true

AuthRpc:
  Endpoints:
    - auth:9081
  NonBlock: true

# Redis is used for admin token revocation (logout) and Redis Streams events.
Redis:
  Addr: redis:6379
  Password: ${REDIS_PASSWORD}
  DB: 0

Kafka:
  Brokers:
    - redpanda:9092
  EventsTopic: growth.events

Auth:
  # Adminway issues admin tokens (audience growth-admin) with its OWN ES256
  # keypair — separate from the user-token pair so an adminway compromise
  # cannot mint user tokens.
  PrivateKey: "${ADMIN_JWT_PRIVATE_KEY}"
  # Legacy HS256 shared secret kept for the dual-verify migration window.
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: growth-admin
  AccessExpiryDuration: 15m
  RefreshExpiryDuration: 168h

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

RateLimit:
  Namespace: adminway
  Redis:
    Host: redis:6379
    Type: node
    Pass: ${REDIS_PASSWORD}
  AuthQuota: "60,10"
  AIQuota: "60,10"
  SearchQuota: "60,30"

Telemetry:
  Name: admin-api
  Endpoint: tempo:4317
  Sampler: 0.3
  Batcher: otlpgrpc

Log:
  ServiceName: admin-api
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics

# Liveness probe server (go-zero DevServer) — compose healthcheck hits
# /healthz. Metrics are served by the Prometheus agent above; pprof stays off.
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9203
  HealthPath: /healthz
  HealthResponse: ok
  EnableMetrics: false
  EnablePprof: false
