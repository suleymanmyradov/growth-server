# Production analytics consumer configuration.

Postgres:
  Datasource: ${POSTGRES_DATASOURCE}
  MaxOpenConns: 10
  MaxIdleConns: 5
  ConnMaxLifetime: 30m

Kafka:
  Brokers:
    - redpanda:9092
  EventsTopic: growth.events
  ConsumerGroup: analytics-consumer
  DLQTopic: growth.events.dlq
  Processors: 4
  Consumers: 4

Telemetry:
  Endpoint: tempo:4317

Log:
  ServiceName: analytics-consumer
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9112
  Path: /metrics
