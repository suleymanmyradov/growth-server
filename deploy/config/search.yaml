# Production search RPC service configuration.

Name: search.rpc
ListenOn: 0.0.0.0:9083

Meili:
  Host: http://meilisearch:7700
  APIKey: ${MEILI_MASTER_KEY}
  Index: growth_search

JWT:
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Telemetry:
  Name: search.rpc
  Endpoint: tempo:4317
  Sampler: 0.3
  Batcher: otlpgrpc

Log:
  ServiceName: search
  Mode: console
  Encoding: json
  Level: info

Prometheus:
  Host: 0.0.0.0
  Port: 9106
  Path: /metrics

# Liveness probe server (go-zero DevServer) — compose healthcheck hits
# /healthz. Metrics are served by the Prometheus agent above; pprof stays off.
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9206
  HealthPath: /healthz
  HealthResponse: ok
  EnableMetrics: false
  EnablePprof: false
