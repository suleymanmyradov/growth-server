# Alert rules for the growth stack.
# These fire inside Prometheus; to receive notifications wire an
# Alertmanager (or Grafana alert contacts) later — Grafana's built-in
# alerting can also evaluate these same queries.

groups:
  - name: growth-availability
    rules:
      - alert: ServiceDown
        expr: up{job="growth"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for >2 minutes."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~"deploy-.*"}[15m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted >2 times in 15m"

  - name: growth-errors
    rules:
      - alert: HighHttp5xxRate
        expr: rate(http_server_requests_code_total{code=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx rate on {{ $labels.instance }} ({{ $labels.path }})"
          description: "HTTP 5xx responses above 0.1/s for 5 minutes."

      - alert: HighRpcErrorRate
        expr: rate(rpc_server_requests_code_total{code!="OK"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "gRPC errors on {{ $labels.instance }} ({{ $labels.method }})"

      - alert: SqlErrors
        expr: rate(sql_client_requests_error_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SQL client errors on {{ $labels.instance }}"

      - alert: DLQMessages
        expr: increase(consumer_events_dlq_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Events routed to DLQ ({{ $labels.event_type }}: {{ $labels.reason }})"
          description: "Poison messages are landing in growth.events.dlq — investigate the consumer logs."

      - alert: BillingWebhookPermanentFailures
        expr: increase(client_billing_webhook_permanent_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Billing webhook events permanently failed ({{ $labels.provider }}: {{ $labels.event_type }})"
          description: "Unprocessable billing events were marked processed and will NOT be retried — reconcile the affected subscriptions manually from the provider dashboard."

  - name: growth-latency
    rules:
      - alert: HighHttpLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_duration_ms_bucket[5m])) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 HTTP latency >2s on {{ $labels.instance }}"

      - alert: HighRpcLatency
        expr: histogram_quantile(0.95, rate(rpc_server_requests_duration_ms_bucket[5m])) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 gRPC latency >1s on {{ $labels.instance }}"

  - name: growth-host
    rules:
      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} <15% free"
          description: "Only {{ $value | humanizePercentage }} free on {{ $labels.mountpoint }} — Postgres/MinIO/Loki will fail when it hits 0."

      - alert: HostMemoryAlmostFull
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory <10% available"
          description: "Container limits total ~10GB on an 8GB VM — OOM kills are imminent."

      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful {{ $labels.job }} backup in 36h"
          description: "Backups live only on this VM — a stale backup means a VM loss is unrecoverable. Check the growth-backup timers."

      - alert: BackupNeverRan
        expr: absent(backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backup metrics missing entirely"
          description: "node-exporter sees no backup_last_success_timestamp_seconds — the backup timers may never have run or textfile dir isn't mounted."

      - alert: PublicEndpointDown
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Public endpoint down: {{ $labels.instance }}"
          description: "blackbox probe to {{ $labels.instance }} failing for >3m (DNS/TLS/Caddy/handler level)."

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires <7d"
          description: "Caddy auto-renews, so a warning means renewal is failing (port 80/443 reachability or rate limits)."
