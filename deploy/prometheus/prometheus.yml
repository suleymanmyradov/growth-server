# Prometheus scrape config for the growth stack.
# Services expose /metrics on the ports below (go-zero prometheus agent,
# configured via the `Prometheus:` block in each deploy/config/*.yaml).
# All targets are on the `growth` docker network — no host ports needed.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: growth
    static_configs:
      - targets:
          - gateway:9101
          - ai-gateway:9102
          - adminway:9103
          - auth:9104
          - client:9105
          - search:9106
          - ai-coach:9107
          - filemanager:9108
          - notifications:9109
          - ai-coach-consumer:9110
          - search-sync:9111
          - analytics-consumer:9112
        labels:
          stack: growth

  # Container-level CPU/mem/restart metrics.
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  # Host-level disk/memory/load + backup-staleness textfile metrics.
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # External-view probes of the public endpoints (through real DNS/TLS).
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.evolella.com/health
          - https://app.evolella.com
          - https://admin.evolella.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
