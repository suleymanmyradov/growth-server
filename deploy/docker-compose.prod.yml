# =============================================================================
# Production Docker Compose for evolella.com backend (AWS EC2 free plan).
#
# Target: m7i-flex.large (2 vCPU, 8 GB RAM, x86_64) — the largest free-tier-
# eligible type; the free plan blocks other instance types at the API level.
# All Go services are built from deploy/Dockerfile.golang with different
# SERVICE_PATH build args (BuildKit injects the native arch). Config files are
# mounted from deploy/config/. The Next.js frontends build from sibling repos
# (self-dev/, growth-admin-front/) via their own Dockerfiles.
#
# Images: Go services and frontends are pulled from GHCR (built by GitHub
# Actions, tagged sha-<commit> and latest). The build: blocks are kept as a
# fallback for local/emergency builds. Override tags via env: BACKEND_TAG,
# FRONTEND_TAG, ADMIN_TAG (e.g. rollback: BACKEND_TAG=sha-abc1234 ... up -d).
#
# Usage:
#   1. Copy .env.prod.example → .env.prod, fill in real secrets
#   2. docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull
#   3. docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#   4. Migrations run automatically in CI deploys (deploy/deploy.sh);
#      manually: docker compose ... run --rm migrate up
#
# Secrets are split per-service: `.env.prod` is used ONLY for compose-time
# interpolation (image tags, domains, postgres bootstrap, build args) and is
# NOT attached to app containers. Each service reads `.env.shared` (non-secret
# shared config) + `.env.<svc>` (only the secrets that service needs — incl.
# its own Postgres role credentials created by deploy/scripts/setup-db-roles.sh).
#
# Memory budget (m7i-flex.large, 8 GB): core services cap at ~6.5 GB;
# +admin/monitoring profiles ≈ 8.2 GB worst-case at the caps. Limits are
# ceilings, not reservations — check cAdvisor for actual usage.
# =============================================================================

# Default container log policy: json-file with rotation so a chatty service
# can't fill the disk. Promtail scrapes via the Docker API (json-file driver).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===================== Stateful dependencies =====================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sum of per-service MaxOpenConns (~110) + migrate/psql headroom.
    command: ["postgres", "-c", "max_connections=160"]
    ports:
      # Localhost-only on the VM — reached via SSH tunnel, never exposed publicly.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - growth

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: revoked:* session markers and rotated-token records must never
    # be evicted under memory pressure — evicting them resurrects logged-out
    # sessions. Cache writes start failing loudly instead of silently dropping
    # security state (monitor Redis OOM errors / INFO evicted_keys stays 0).
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - growth

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command: >
      redpanda start
      --smp 1
      --memory 1G
      --reserve-memory 0M
      --overprovisioned
      --node-id 0
      --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - growth

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: meili binds IPv4 only; localhost may resolve to ::1.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - growth

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - growth

  # ===================== RPC microservices =====================
  # All use the shared Dockerfile.golang with different SERVICE_PATH.

  auth:
    image: ghcr.io/suleymanmyradov/growth-server-auth:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/auth/rpc
    restart: unless-stopped
    command: ["-f", "/config/auth.yaml"]
    # .env.auth carries JWT_PRIVATE_KEY — it must ONLY be attached to this
    # container. Every other service verifies with the public key.
    env_file:
      - .env.shared
      - .env.auth
    volumes:
      - ./config/auth.yaml:/config/auth.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9204/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  client:
    image: ghcr.io/suleymanmyradov/growth-server-client:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/client/rpc
    restart: unless-stopped
    command: ["-f", "/config/client.yaml"]
    env_file:
      - .env.shared
      - .env.client
    volumes:
      - ./config/client.yaml:/config/client.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9205/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  search:
    image: ghcr.io/suleymanmyradov/growth-server-search:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/search/rpc
    restart: unless-stopped
    command: ["-f", "/config/search.yaml"]
    env_file:
      - .env.shared
      - .env.search
    volumes:
      - ./config/search.yaml:/config/search.yaml:ro
    depends_on:
      meilisearch:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9206/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  ai-coach:
    image: ghcr.io/suleymanmyradov/growth-server-ai-coach:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/ai-coach/rpc
    restart: unless-stopped
    command: ["-f", "/config/aicoach.yaml"]
    env_file:
      - .env.shared
      - .env.ai-coach
    volumes:
      - ./config/aicoach.yaml:/config/aicoach.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 224M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9207/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  filemanager:
    image: ghcr.io/suleymanmyradov/growth-server-filemanager:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/filemanager/rpc
    restart: unless-stopped
    command: ["-f", "/config/filemanager.yaml"]
    env_file:
      - .env.shared
      - .env.filemanager
    volumes:
      - ./config/filemanager.yaml:/config/filemanager.yaml:ro
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9208/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  notifications:
    image: ghcr.io/suleymanmyradov/growth-server-notifications:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/notifications/rpc
    restart: unless-stopped
    command: ["-f", "/config/notifications.yaml"]
    env_file:
      - .env.shared
      - .env.notifications
    volumes:
      - ./config/notifications.yaml:/config/notifications.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9209/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  # ===================== Kafka consumers =====================

  ai-coach-consumer:
    image: ghcr.io/suleymanmyradov/growth-server-ai-coach-consumer:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/ai-coach-consumer
    restart: unless-stopped
    command: ["-f", "/config/ai-coach-consumer.yaml"]
    env_file:
      - .env.shared
      - .env.ai-coach-consumer
    volumes:
      - ./config/ai-coach-consumer.yaml:/config/ai-coach-consumer.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 224M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9110/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  search-sync:
    image: ghcr.io/suleymanmyradov/growth-server-search-sync:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/search-sync
    restart: unless-stopped
    command: ["-f", "/config/search-sync.yaml"]
    env_file:
      - .env.shared
      - .env.search-sync
    volumes:
      - ./config/search-sync.yaml:/config/search-sync.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9111/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  analytics-consumer:
    image: ghcr.io/suleymanmyradov/growth-server-analytics-consumer:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/analytics-consumer
    restart: unless-stopped
    command: ["-f", "/config/analytics.yaml"]
    env_file:
      - .env.shared
      - .env.analytics-consumer
    volumes:
      - ./config/analytics.yaml:/config/analytics.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - analytics
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9112/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  # ===================== Migrations (one-shot) =====================
  # Run explicitly: docker compose ... run --rm migrate up
  # CI deploys (deploy/deploy.sh) run it before restarting services.

  migrate:
    image: ghcr.io/suleymanmyradov/growth-server-migrations:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    command: ["-path=/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  # ===================== API gateways =====================

  gateway:
    image: ghcr.io/suleymanmyradov/growth-server-gateway:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/gateway/growth
    restart: unless-stopped
    command: ["-f", "/config/growthapi.yaml"]
    env_file:
      - .env.shared
      - .env.gateway
    volumes:
      - ./config/growthapi.yaml:/config/growthapi.yaml:ro
    depends_on:
      auth:
        condition: service_started
      client:
        condition: service_started
      search:
        condition: service_started
      notifications:
        condition: service_started
      filemanager:
        condition: service_started
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9201/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  ai-gateway:
    image: ghcr.io/suleymanmyradov/growth-server-ai-gateway:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/ai-gateway/aiapi
    restart: unless-stopped
    command: ["-f", "/config/aiapi.yaml"]
    env_file:
      - .env.shared
      - .env.ai-gateway
    volumes:
      - ./config/aiapi.yaml:/config/aiapi.yaml:ro
    depends_on:
      auth:
        condition: service_started
      client:
        condition: service_started
      ai-coach:
        condition: service_started
      search:
        condition: service_started
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9202/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  adminway:
    image: ghcr.io/suleymanmyradov/growth-server-adminway:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/adminway/adminapi
    restart: unless-stopped
    command: ["-f", "/config/adminapi.yaml"]
    # .env.adminway carries ADMIN_JWT_PRIVATE_KEY — adminway is the only
    # issuer of admin tokens (audience growth-admin).
    env_file:
      - .env.shared
      - .env.adminway
    volumes:
      - ./config/adminapi.yaml:/config/adminapi.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      client:
        condition: service_started
      filemanager:
        condition: service_started
      search:
        condition: service_started
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    profiles:
      - admin
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 112M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9203/healthz"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    networks:
      - growth

  # ===================== Web frontends =====================

  frontend:
    image: ghcr.io/suleymanmyradov/self-dev:${FRONTEND_TAG:-latest}
    build:
      context: ../../self-dev
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
        NEXT_PUBLIC_ENABLE_PWA: ${NEXT_PUBLIC_ENABLE_PWA:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV:-production}
        NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_PRO_MONTHLY:-}
        NEXT_PUBLIC_PADDLE_PRICE_PRO_YEARLY: ${NEXT_PUBLIC_PADDLE_PRICE_PRO_YEARLY:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_PROXY_URL=http://gateway:8888
      - NEXT_PUBLIC_AI_GATEWAY_URL=http://ai-gateway:8889
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # ES256 public key — verify-only; cannot mint tokens.
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      # Server-side error capture (instrumentation.ts); empty = disabled.
      # Uses the growth-web project DSN so browser + server errors share one project.
      - SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    depends_on:
      gateway:
        condition: service_started
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 448M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    networks:
      - growth

  admin-frontend:
    image: ghcr.io/suleymanmyradov/growth-admin-front:${ADMIN_TAG:-latest}
    build:
      context: ../../growth-admin-front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_ADMIN_API_URL=http://adminway:8890
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      # adminway issues tokens for the "growth-admin" audience (see
      # deploy/config/adminapi.yaml Auth.Audience) — NOT the gateway's
      # ${JWT_AUDIENCE} (growth-api). Verifying against the wrong audience
      # makes proxy.ts reject every valid token → login redirect loop.
      # ES256 public half of adminway's keypair — verify-only.
      - JWT_PUBLIC_KEY=${ADMIN_JWT_PUBLIC_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=growth-admin
      # Server-side error capture (instrumentation.ts); empty = disabled.
      # Uses the growth-admin project DSN so browser + server errors share one project.
      - SENTRY_DSN=${ADMIN_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    profiles:
      - admin
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/login"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    networks:
      - growth

  # ===================== Reverse proxy (TLS) =====================

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - APP_DOMAIN=${APP_DOMAIN}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated Paddle webhook IP allowlist — refresh on the host via
      # deploy/scripts/fetch-paddle-webhook-ips.sh (cron), then caddy reload.
      - ./caddy/paddle-webhook-ips.caddyfile:/etc/caddy/paddle-webhook-ips.caddyfile:ro
      # Generated admin-panel IP allowlist — written by deploy.sh from
      # ADMIN_ALLOWED_IPS before compose runs.
      - ./caddy/admin-allowlist.caddyfile:/etc/caddy/admin-allowlist.caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_started
      ai-gateway:
        condition: service_started
      frontend:
        condition: service_started
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 96M
    networks:
      - growth

  # ============ Observability (profile: monitoring) ============
  # Prometheus + Grafana + Loki + Promtail + Tempo + cAdvisor.
  # Grafana binds to localhost only — access via SSH tunnel:
  #   ssh -L 3001:localhost:3001 root@<vm-ip>  →  http://127.0.0.1:3001
  # To expose it publicly, uncomment the grafana block in the Caddyfile and
  # add a DNS record for ${GRAFANA_DOMAIN}.

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M
    profiles:
      - monitoring
    networks:
      - growth

  # Routes the alerts in prometheus/alerts.yml to email via Resend SMTP.
  # resend_api_key is a gitignored file under deploy/alertmanager/secrets/ —
  # see its README. From/to addresses come from ALERT_EMAIL_* in .env.prod
  # (defaults below work out of the box if the from-domain is Resend-verified).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@evolella.com}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-support@evolella.com}
    entrypoint: ["/bin/sh", "-c"]
    # command must be a single-element list: a multi-line string gets
    # word-split by compose into argv, leaving sh -c with only "sed".
    command:
      - 'sed -e "s|__ALERT_EMAIL_FROM__|$${ALERT_EMAIL_FROM}|g" -e "s|__ALERT_EMAIL_TO__|$${ALERT_EMAIL_TO}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    profiles:
      - monitoring
    networks:
      - growth

  # Host-level metrics (disk, memory, load) — cadvisor only sees containers.
  # Also collects backup-staleness metrics from /home/ubuntu/backups/textfile
  # (written by deploy/scripts/backup-*.sh).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|host/etc|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /home/ubuntu/backups/textfile:/textfile:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    profiles:
      - monitoring
    networks:
      - growth

  # External-view probes of the public endpoints (TLS, DNS, Caddy, handler).
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
    profiles:
      - monitoring
    networks:
      - growth

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 224M
    profiles:
      - monitoring
    networks:
      - growth

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 320M
    profiles:
      - monitoring
    networks:
      - growth

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on:
      - loki
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 96M
    profiles:
      - monitoring
    networks:
      - growth

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - monitoring
    networks:
      - growth

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    profiles:
      - monitoring
    networks:
      - growth

# ===================== Volumes =====================

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  meili_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
  promtail_positions:

# ===================== Network =====================

networks:
  growth:
    driver: bridge
