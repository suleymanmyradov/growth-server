# =============================================================================
# Production Docker Compose for evolella.com backend (AWS EC2 free plan).
#
# Target: m7i-flex.large (2 vCPU, 8 GB RAM, x86_64) — the largest free-tier-
# eligible type; the free plan blocks other instance types at the API level.
# All Go services are built from deploy/Dockerfile.golang with different
# SERVICE_PATH build args (BuildKit injects the native arch). Config files are
# mounted from deploy/config/. The Next.js frontends build from sibling repos
# (self-dev/, growth-admin-front/) via their own Dockerfiles.
#
# Usage:
#   1. Copy .env.prod.example → .env.prod, fill in real secrets
#   2. docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod build
#   3. docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d
#   4. Run migrations (see deploy/README.md)
# =============================================================================

services:
  # ===================== Stateful dependencies =====================

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Localhost-only on the VM — reached via SSH tunnel, never exposed publicly.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - growth

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - growth

  redpanda:
    image: redpandadata/redpanda:latest
    restart: unless-stopped
    command: >
      redpanda start
      --smp 1
      --memory 1G
      --reserve-memory 0M
      --overprovisioned
      --node-id 0
      --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - growth

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: meili binds IPv4 only; localhost may resolve to ::1.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - growth

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - growth

  # ===================== RPC microservices =====================
  # All use the shared Dockerfile.golang with different SERVICE_PATH.

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/auth/rpc
    restart: unless-stopped
    command: ["-f", "/config/auth.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/auth.yaml:/config/auth.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - growth

  client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/client/rpc
    restart: unless-stopped
    command: ["-f", "/config/client.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/client.yaml:/config/client.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - growth

  search:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/search/rpc
    restart: unless-stopped
    command: ["-f", "/config/search.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/search.yaml:/config/search.yaml:ro
    depends_on:
      meilisearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  ai-coach:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/ai-coach/rpc
    restart: unless-stopped
    command: ["-f", "/config/aicoach.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/aicoach.yaml:/config/aicoach.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - growth

  filemanager:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/filemanager/rpc
    restart: unless-stopped
    command: ["-f", "/config/filemanager.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/filemanager.yaml:/config/filemanager.yaml:ro
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  notifications:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/notifications/rpc
    restart: unless-stopped
    command: ["-f", "/config/notifications.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/notifications.yaml:/config/notifications.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  # ===================== Kafka consumers =====================

  ai-coach-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/ai-coach-consumer
    restart: unless-stopped
    command: ["-f", "/config/ai-coach-consumer.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/ai-coach-consumer.yaml:/config/ai-coach-consumer.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - growth

  search-sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/search-sync
    restart: unless-stopped
    command: ["-f", "/config/search-sync.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/search-sync.yaml:/config/search-sync.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  analytics-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/microservices/analytics-consumer
    restart: unless-stopped
    command: ["-f", "/config/analytics.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/analytics.yaml:/config/analytics.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    profiles:
      - analytics
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  # ===================== API gateways =====================

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/gateway/growth
    restart: unless-stopped
    command: ["-f", "/config/growthapi.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/growthapi.yaml:/config/growthapi.yaml:ro
    depends_on:
      auth:
        condition: service_started
      client:
        condition: service_started
      search:
        condition: service_started
      notifications:
        condition: service_started
      filemanager:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  ai-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/ai-gateway/aiapi
    restart: unless-stopped
    command: ["-f", "/config/aiapi.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/aiapi.yaml:/config/aiapi.yaml:ro
    depends_on:
      auth:
        condition: service_started
      client:
        condition: service_started
      ai-coach:
        condition: service_started
      search:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  adminway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.golang
      args:
        SERVICE_PATH: ./services/adminway/adminapi
    restart: unless-stopped
    command: ["-f", "/config/adminapi.yaml"]
    env_file:
      - .env.prod
    volumes:
      - ./config/adminapi.yaml:/config/adminapi.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      client:
        condition: service_started
      filemanager:
        condition: service_started
      search:
        condition: service_started
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    profiles:
      - admin
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

  # ===================== Web frontends =====================

  frontend:
    build:
      context: ../../self-dev
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
        NEXT_PUBLIC_ENABLE_PWA: ${NEXT_PUBLIC_ENABLE_PWA:-false}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_PROXY_URL=http://gateway:8888
      - NEXT_PUBLIC_AI_GATEWAY_URL=http://ai-gateway:8889
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
    depends_on:
      gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - growth

  admin-frontend:
    build:
      context: ../../growth-admin-front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_ADMIN_API_URL=http://adminway:8890
      - NEXT_PUBLIC_APP_URL=${APP_URL}
      # adminway issues tokens for the "growth-admin" audience (see
      # deploy/config/adminapi.yaml Auth.Audience) — NOT the gateway's
      # ${JWT_AUDIENCE} (growth-api). Verifying against the wrong audience
      # makes proxy.ts reject every valid token → login redirect loop.
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=growth-admin
    profiles:
      - admin
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - growth

  # ===================== Reverse proxy (TLS) =====================

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - API_DOMAIN=${API_DOMAIN}
      - APP_DOMAIN=${APP_DOMAIN}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_started
      ai-gateway:
        condition: service_started
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - growth

# ===================== Volumes =====================

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  meili_data:
  minio_data:
  caddy_data:
  caddy_config:

# ===================== Network =====================

networks:
  growth:
    driver: bridge
