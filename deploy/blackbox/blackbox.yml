# Blackbox exporter modules — external-view probes of the public endpoints.
# Runs inside the growth network but resolves + TLS-handshakes the real
# public domains, so it catches DNS, certificate, Caddy, and handler-level
# breakage. (A total VM/network outage still needs an external monitor such
# as UptimeRobot — this can't observe its own host dying.)
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: false
      preferred_ip_protocol: ip4

  # For endpoints that MUST refuse unauthenticated requests (e.g. unsigned
  # /files/* against the private MinIO bucket). probe_success=1 only when
  # the answer is a rejection — a 200 here means anonymous access is open.
  http_4xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [403, 404]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: false
      preferred_ip_protocol: ip4
