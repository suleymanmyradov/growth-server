# Azure client RPC configuration.

Name: client.rpc
ListenOn: 0.0.0.0:9082
Timeout: 30000

Postgres:
  Datasource: ${AZURE_POSTGRES_DATASOURCE}
  MaxOpenConns: 25
  MaxIdleConns: 5
  ConnMaxLifetime: 5m

Telemetry:
  Name: client.rpc
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc

# Kafka brokers left empty → Redis Streams is used as the event transport.
Kafka:
  Brokers: []
  EventsTopic: growth.events
  ConsumerGroup: client

AppRedis:
  Addr: redis:6379
  DB: 0
  Password: ${REDIS_PASSWORD}

JWT:
  # Verify-only: public key of the auth service's ES256 pair.
  PublicKey: "${JWT_PUBLIC_KEY}"
  # Legacy HS256 fallback — dual-verify window only.
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Billing:
  Mode: ${BILLING_MODE}
  StripeSecretKey: ${STRIPE_SECRET_KEY}
  StripeWebhookSecret: ${STRIPE_WEBHOOK_SECRET}
  FrontendURL: ${APP_URL}
  Paddle:
    Enabled: ${PADDLE_ENABLED}
    Environment: ${PADDLE_ENVIRONMENT}
    APIKey: ${PADDLE_API_KEY}
    WebhookSecret: ${PADDLE_WEBHOOK_SECRET}

WeeklyReview:
  RegenerationCooldown: 1s
