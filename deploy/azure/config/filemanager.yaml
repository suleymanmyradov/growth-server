Name: filemanager.rpc
ListenOn: 0.0.0.0:9087

MinIO:
  Endpoint: minio:9000
  AccessKey: ${MINIO_ACCESS_KEY}
  SecretKey: ${MINIO_SECRET_KEY}
  UseSSL: false
  DefaultBucket: growthmind
  Region: us-east-1

# file_objects registry — object ownership + expiry. Required for delete
# authorization, account-deletion fan-out and retention sweeps.
Postgres:
  Datasource: ${AZURE_POSTGRES_DATASOURCE}
  MaxOpenConns: 10
  MaxIdleConns: 2
  ConnMaxLifetime: 5m

# user_deleted consumer — removes every object owned by the deleted user.
# Kafka brokers left empty → Redis Streams is used as the event transport.
UserDeletion:
  Brokers: []
  Topic: growth.events
  Group: filemanager.user-deleted
  RedisAddr: redis:6379
  RedisPassword: ${REDIS_PASSWORD}
  RedisDB: 0

# Expired-object sweeper (exports/ objects carry a 24h expires_at).
Cleanup:
  Interval: 5m
  BatchSize: 100

Telemetry:
  Name: filemanager.rpc
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc
