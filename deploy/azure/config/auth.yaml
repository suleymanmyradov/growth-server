# Azure auth RPC configuration.
# PostgreSQL → Azure Database for PostgreSQL (managed)
# Events → Redis Streams (self-hosted Redis on VM)

Name: auth.rpc
ListenOn: 0.0.0.0:9081

Postgres:
  Datasource: ${AZURE_POSTGRES_DATASOURCE}
  MaxOpenConns: 25
  MaxIdleConns: 5
  ConnMaxLifetime: 5m

JWT:
  PrivateKey: ${JWT_PRIVATE_KEY}
  # Legacy HS256 fallback — dual-verify window only.
  Secret: ${JWT_SECRET}
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}
  AccessExpiryDuration: 15m
  RefreshExpiryDuration: 168h

Cache:
  Redis:
    Addr: redis:6379
    Password: ${REDIS_PASSWORD}
    DB: 0
    Prefix: growth-auth

Email:
  Provider: resend
  APIKey: ${RESEND_API_KEY}
  FromAddress: ${EMAIL_FROM_ADDRESS}
  FrontendBaseURL: ${APP_URL}

GoogleOAuth:
  ClientID: ${GOOGLE_CLIENT_ID}
  ClientSecret: ${GOOGLE_CLIENT_SECRET}
  RedirectURI: ${APP_URL}/auth/callback/google
  AllowedRedirectURIs:
    - ${APP_URL}/auth/callback/google
    - com.evolella.app.dev:/oauthredirect
    - com.evolella.app.preview:/oauthredirect
    - com.evolella.app:/oauthredirect

# Kafka brokers left empty → Redis Streams is used as the event transport.
# EventsTopic/ReminderDueTopic are reused as Redis Stream names.
Kafka:
  Brokers: []
  EventsTopic: growth.events

Telemetry:
  Name: auth.rpc
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc
