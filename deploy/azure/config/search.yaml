Name: search.rpc
ListenOn: 0.0.0.0:9083

Meili:
  Host: http://meilisearch:7700
  APIKey: ${MEILI_MASTER_KEY}
  Index: growth_search

JWT:
  # Verify-only: public key of the auth service's ES256 pair.
  PublicKey: "${JWT_PUBLIC_KEY}"
  Issuer: ${JWT_ISSUER}
  Audience: ${JWT_AUDIENCE}

ServiceAuth:
  Secret: ${SERVICE_AUTH_SECRET}

Telemetry:
  Name: search.rpc
  Endpoint:
  Sampler: 1.0
  Batcher: otlpgrpc
