syntax = "proto3";

package aicoach;

option go_package = "./aicoach";

// Check-in Feedback
message CheckInFeedbackRequest {
  string user_id = 1;
  string habit_id = 2;
  string habit_name = 3;
  string status = 4; // completed | missed
  string mood = 5;
  string energy = 6;
  string blocker = 7;
  string note = 8;
  int32 streak = 9;
  string accountability_style = 10;
  string preferred_tone = 11;
  string difficulty_preference = 12;
  repeated string common_blockers = 13;
  string recent_pattern = 14;
  string goal_title = 15;
}

message CheckInFeedbackResponse {
  string feedback = 1;
}

// Personalized Coaching
message PersonalizedCoachingRequest {
  string user_id = 1;
  string user_message = 2;
  string accountability_style = 3;
  string preferred_tone = 4;
  string difficulty_preference = 5;
  repeated string active_goals = 6;
  repeated string active_habits = 7;
  string recent_check_ins_summary = 8;
  repeated string common_blockers = 9;
  map<string, string> pattern_insights = 10;
  repeated HistoryMessage history = 11;  // prior conversation messages (oldest first)
  string user_full_name = 12;
  string user_bio = 13;
  string user_location = 14;
  repeated string user_interests = 15;
}

// HistoryMessage is a single prior message in a conversation, used to give the
// LLM context from earlier turns.
message HistoryMessage {
  string role = 1;    // "user" | "assistant"
  string content = 2;
}

message PersonalizedCoachingResponse {
  string coaching_response = 1;
}

// Weekly Review
message HabitBreakdown {
  string habit_id = 1;
  string habit_name = 2;
  string category = 3;
  int32 completed_count = 4;
  int32 missed_count = 5;
  float completion_rate = 6;
}

message BlockerStat {
  string blocker = 1;
  int32 count = 2;
}

message MoodStat {
  string mood = 1;
  int32 count = 2;
}

message EnergyStat {
  string energy = 1;
  int32 count = 2;
}

message WeeklyReviewAdjustment {
  string habit_id = 1;
  string habit_name = 2;
  string reason = 3;
  string suggestion = 4;
  string adjustment_type = 5; // reduce_difficulty | change_time | clarify_plan | keep_same | pause_habit
}

message NextWeekPlan {
  string focus = 1;
  repeated string commitments = 2;
  repeated string risks = 3;
  repeated string recovery_actions = 4;
}

message WeeklyReviewRequest {
  string user_id = 1;
  string accountability_style = 2;
  string preferred_tone = 3;
  string difficulty_preference = 4;
  repeated string common_blockers = 5;
  repeated string goals = 6;
  int32 total_habits = 7;
  float completion_rate = 8;
  int32 completed_check_ins = 9;
  int32 missed_check_ins = 10;
  string best_day = 11;
  string hardest_day = 12;
  string top_blocker = 13;
  repeated HabitBreakdown habit_breakdowns = 14;
  repeated BlockerStat blocker_stats = 15;
  repeated MoodStat mood_stats = 16;
  repeated EnergyStat energy_stats = 17;
  repeated string detected_patterns = 18;
}

message WeeklyReviewResponse {
  string ai_summary = 1;
  repeated WeeklyReviewAdjustment suggested_adjustments = 2;
  NextWeekPlan next_week_plan = 3;
}

// Streaming weekly review
message WeeklyReviewStreamChunk {
  string delta = 1;              // text delta (summary text as it's generated)
  bool complete = 2;             // true when the stream is finished
  WeeklyReviewResponse review = 3; // full structured response (only set when complete=true)
  bool finalizing = 4;           // true when text is done, backend is parsing JSON
  string reasoning = 5;          // reasoning/thinking delta from <thought> tags (Gemma-4 fallbacks)
}

// Streaming personalized coaching
message PersonalizedCoachingStreamChunk {
  string delta = 1;              // text delta (coaching response as it's generated)
  bool complete = 2;             // true when the stream is finished
  string full_response = 3;      // full coaching response (only set when complete=true)
  string reasoning = 4;          // reasoning/thinking delta from <thought> tags (Gemma-4 fallbacks)
}

// Onboarding Habit Generation
message OnboardingHabitSuggestion {
  string name = 1;
  string description = 2;
}

message GenerateOnboardingHabitsRequest {
  string user_id = 1;
  string goal_title = 2;
  string goal_category = 3;
  string motivation = 4;
  string blocker = 5;
  int32 daily_minutes = 6;
  string accountability_style = 7; // gentle | balanced | strict
}

message GenerateOnboardingHabitsResponse {
  repeated OnboardingHabitSuggestion habits = 1;
}

service AICoachService {
  rpc GenerateCheckInFeedback(CheckInFeedbackRequest) returns (CheckInFeedbackResponse);
  rpc GeneratePersonalizedCoaching(PersonalizedCoachingRequest) returns (PersonalizedCoachingResponse);
  rpc GenerateWeeklyReview(WeeklyReviewRequest) returns (WeeklyReviewResponse);
  rpc StreamWeeklyReview(WeeklyReviewRequest) returns (stream WeeklyReviewStreamChunk);
  // Deprecated: The agentic coaching flow now streams directly from the
  // ai-gateway API service using StreamAgent with on-demand tool calls.
  // This RPC is still called by the voice-turn handler for voice coaching.
  // Do not add new callers; new text coaching goes through the ai-gateway.
  rpc StreamPersonalizedCoaching(PersonalizedCoachingRequest) returns (stream PersonalizedCoachingStreamChunk) {
    option deprecated = true;
  }
  rpc GenerateOnboardingHabits(GenerateOnboardingHabitsRequest) returns (GenerateOnboardingHabitsResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);

  // Long-term memory, exposed so the agentic coaching flow in the gateway can
  // search past conversations as an explicit tool call rather than having
  // snippets injected into every prompt. On-demand retrieval keeps the default
  // prompt small and gives the reply an auditable basis: the coach can say what
  // it looked up.
  rpc SearchMemory(SearchMemoryRequest) returns (SearchMemoryResponse);

  // Curated facts (user_facts): the user-facing controls for inspecting and
  // removing what the coach remembers.
  rpc ListUserFacts(ListUserFactsRequest) returns (ListUserFactsResponse);
  rpc AddUserFact(AddUserFactRequest) returns (AddUserFactResponse);
  rpc ForgetUserFact(ForgetUserFactRequest) returns (ForgetUserFactResponse);
  rpc ForgetAllUserFacts(ForgetAllUserFactsRequest) returns (ForgetAllUserFactsResponse);
}

// --- Long-term memory ---

message SearchMemoryRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;   // optional; server applies its own cap
}

message MemoryHit {
  string entity_type = 1;   // check_in | conversation_message | weekly_review
  string content = 2;
  int64 created_at = 3;     // unix seconds
  string habit_name = 4;    // check_in only
  string role = 5;          // conversation_message only
}

message SearchMemoryResponse {
  repeated MemoryHit hits = 1;
}

// --- Curated facts ---

message UserFact {
  string id = 1;
  string fact = 2;
  string category = 3;      // commitment | preference | constraint | context
  float confidence = 4;
  bool user_authored = 5;
  int64 created_at = 6;
}

message ListUserFactsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListUserFactsResponse {
  repeated UserFact facts = 1;
  int32 total = 2;
}

message AddUserFactRequest {
  string user_id = 1;
  string fact = 2;
  string category = 3;
  // When set, the fact this one replaces. Used when a user corrects something
  // the coach remembered wrongly.
  string supersedes_id = 4;
}

message AddUserFactResponse {
  UserFact fact = 1;
}

message ForgetUserFactRequest {
  string user_id = 1;
  string fact_id = 2;
}

message ForgetUserFactResponse {}

message ForgetAllUserFactsRequest {
  string user_id = 1;
}

message ForgetAllUserFactsResponse {}

// Speech — STT/TTS. Used by the gateway for dictate (mic → text) and live
// voice chat (text → spoken response). The ai-coach service owns the speech
// provider config; the gateway is the orchestrator.
message TranscribeRequest {
  string user_id = 1;
  bytes audio = 2;          // raw audio bytes
  string format = 3;        // wav | mp3 | flac | m4a | ogg | webm | aac
  string language = 4;      // ISO-639-1, optional (auto-detect if empty)
}

message TranscribeResponse {
  string text = 1;
  string language = 2;      // detected language, if reported by provider
  double duration = 3;      // audio duration in seconds, if reported
}

message SynthesizeRequest {
  string user_id = 1;
  string text = 2;          // text to speak
  string voice = 3;         // provider-specific voice, optional (uses config default)
}

message SynthesizeResponse {
  bytes audio = 1;          // synthesized audio bytes
  string format = 2;        // audio format: mp3 | pcm
}

// Conversation Service
message Conversation {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string type = 4;       // coach | therapist
  string last_message = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  bool archived = 8;
}

message ConversationMessage {
  string id = 1;
  string conversation_id = 2;
  string role = 3;        // user | assistant
  string content = 4;
  int64 created_at = 5;
}

message StartConversationRequest {
  string user_id = 1;
  string type = 2;        // coach | therapist
  string title = 3;
  string initial_message = 4;
}

message StartConversationResponse {
  Conversation conversation = 1;
  ConversationMessage initial_message_row = 2; // only set if initial_message was provided
}

message ListConversationsRequest {
  string user_id = 1;
  string type = 2;        // optional filter
  int32 page = 3;
  int32 limit = 4;
  // Which shelf to list. Defaults to false (active conversations); set true to
  // list archived ones. Additive field: existing callers keep the default and
  // stop seeing archived conversations mixed into the active list.
  bool archived = 5;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total = 2;
}

message GetConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message GetMessagesRequest {
  string conversation_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetMessagesResponse {
  repeated ConversationMessage messages = 1;
  int32 total = 2;
}

message AppendMessageRequest {
  string conversation_id = 1;
  string user_id = 2;
  string role = 3;        // user | assistant
  string content = 4;
  // Client-supplied idempotency key. When set, appending twice with the same
  // value returns the existing message rather than duplicating the turn. Only
  // meaningful for client-authored (role=user) messages; server-authored
  // replies leave it empty.
  string client_message_id = 5;
}

message AppendMessageResponse {
  ConversationMessage message = 1;
  Conversation conversation = 2; // updated conversation with new last_message
}

message RegenerateLastResponseRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message RegenerateLastResponseResponse {
  ConversationMessage user_message = 1;
}

message ArchiveConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message ArchiveConversationResponse {
  Conversation conversation = 1;
}

message DeleteConversationRequest {
  string conversation_id = 1;
  string user_id = 2;
}

message DeleteConversationResponse {}

service ConversationService {
  rpc StartConversation(StartConversationRequest) returns (StartConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc AppendMessage(AppendMessageRequest) returns (AppendMessageResponse);
  rpc RegenerateLastResponse(RegenerateLastResponseRequest) returns (RegenerateLastResponseResponse);
  rpc ArchiveConversation(ArchiveConversationRequest) returns (ArchiveConversationResponse);
  rpc UnarchiveConversation(ArchiveConversationRequest) returns (ArchiveConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
}
