syntax = "proto3";

package auth;

option go_package = "./auth";

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string full_name = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_id = 3;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string bio = 5;
  string location = 6;
  string website = 7;
  repeated string interests = 8;
  string avatar_url = 9;
  string created_at = 10;
  string updated_at = 11;
  bool email_verified = 12;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string access_token = 1;
  // Optional refresh token for defense-in-depth revocation. The session is
  // revoked regardless via the access token's session ID, but providing the
  // refresh token also revokes it by value.
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string username = 3;
}

message VerifyAccessTokenRequest {
  string access_token = 1;
}

message VerifyAccessTokenResponse {
  string user_id = 1;
  string username = 2;
  repeated string roles = 3;
  string session_id = 4;
  int64 expires_at = 5;
}

message GetProfileRequest {}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string bio = 3;
  string location = 4;
  string website = 5;
  repeated string interests = 6;
  string avatar_url = 7;
}

message UpdateProfileResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

// RegisterResponse is returned by Register. With email verification enabled,
// registration does not issue tokens; the user must verify their email first
// (VerifyEmail issues tokens on success).
message RegisterResponse {
  bool requires_verification = 1;
  string message = 2;
}

message VerifyEmailRequest {
  string token = 1;
}

message ResendVerificationRequest {
  string email = 1;
}

message GoogleLoginRequest {
  // OAuth authorization code exchanged server-side for Google tokens.
  string authorization_code = 1;
  // Redirect URI registered with Google for this client.
  string redirect_uri = 2;
}

// AppleFullName carries the user's name from the Apple authorization response.
// Apple only provides the name on the FIRST authorization; it is delivered
// outside the ID token (in the authorization response) and the client forwards
// it here. Both fields are empty for subsequent authorizations.
message AppleFullName {
  string given_name = 1;
  string family_name = 2;
}

// AppleLoginRequest authenticates a user via Sign in with Apple. The client
// (expo-apple-authentication) obtains the identity_token and authorization_code
// from Apple and sends both here. The identity token is verified by signature
// against Apple's public keys; the authorization code may be exchanged for a
// refresh token when the Apple private key is configured.
message AppleLoginRequest {
  // Apple authorization code. Required for code exchange (token revocation /
  // subscription status); optional if only identity-token verification is used.
  string authorization_code = 1;
  // Apple ID token (signed JWT). Required — this is the primary credential.
  string identity_token = 2;
  // Optional nonce the client used during authorization. When non-empty, the
  // ID token's nonce claim must match.
  string nonce = 3;
  // User's name, only present on first authorization. Forwarded by the client
  // from the Apple authorization response.
  AppleFullName full_name = 4;
  // Optional redirect URI for code exchange. Validated against an allowlist.
  string redirect_uri = 5;
}

message EmptyResponse {}

message DeleteUserRequest {
  string user_id = 1;
}

// ListUserIdsRequest is used by admin tooling (e.g. broadcast notifications) to
// enumerate every user id. Pagination is cursor-based on created_at + id.
message ListUserIdsRequest {
  int32 limit = 1;        // page size, capped server-side
  string cursor = 2;      // opaque cursor (empty = first page)
}

message ListUserIdsResponse {
  repeated string user_ids = 1;
  string next_cursor = 2;  // empty when no more pages
}

service AuthService {
  // Core authentication
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (EmptyResponse);

  // Token validation
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc VerifyAccessToken(VerifyAccessTokenRequest) returns (VerifyAccessTokenResponse);

  // Profile management
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteUser(DeleteUserRequest) returns (EmptyResponse);

  // Password management
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (EmptyResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (EmptyResponse);

  // Email verification
  rpc VerifyEmail(VerifyEmailRequest) returns (AuthResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (EmptyResponse);

  // OAuth
  rpc GoogleLogin(GoogleLoginRequest) returns (AuthResponse);
  rpc AppleLogin(AppleLoginRequest) returns (AuthResponse);

  // Admin / internal: enumerate user ids (used by adminway for broadcasts).
  rpc ListUserIds(ListUserIdsRequest) returns (ListUserIdsResponse);
}
