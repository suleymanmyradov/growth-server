syntax = "proto3";

package notifications;

option go_package = "./notifications";

// Notification model
message Notification {
  string id = 1;
  string userId = 2;
  string type = 3;
  string title = 4;
  string message = 5;
  bool read = 6;
  int64 createdAt = 7;
}

message CreateNotificationRequest {
  string userId = 1;
  string type = 2;
  string title = 3;
  string message = 4;
}

message CreateNotificationResponse {
  string notificationId = 1;
}

message GetNotificationRequest {
  string notificationId = 1;
}

message GetNotificationResponse {
  Notification notification = 1;
}

message ListNotificationsRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool onlyUnread = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 totalCount = 2;
  int32 unreadCount = 3;
}

message MarkNotificationReadRequest {
  string notificationId = 1;
}

message MarkNotificationReadResponse {
  bool success = 1;
}

message MarkAllNotificationsReadRequest {}

message MarkAllNotificationsReadResponse {
  bool success = 1;
}

message DeleteNotificationRequest {
  string notificationId = 1;
}

message DeleteNotificationResponse {
  bool success = 1;
}

message GetUnreadCountRequest {}

message GetUnreadCountResponse {
  int32 count = 1;
}

// NotificationPreferences owns the per-user notification delivery flags.
// Owned exclusively by the notifications service. The user is derived from
// the authenticated principal in the RPC context, not from a request field.
message NotificationPreferences {
  bool emailEnabled = 1;
  bool pushEnabled = 2;
  bool habitRemindersEnabled = 3;
  bool goalRemindersEnabled = 4;
}

message GetNotificationPreferencesRequest {}

message GetNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message UpdateNotificationPreferencesRequest {
  NotificationPreferences preferences = 1;
}

message UpdateNotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

// ─── Push device registration ───────────────────────────────────────────────
// See docs/push-notifications-design.md. The user is derived from the
// authenticated principal in the RPC context, not from a request field.

message RegisterDeviceRequest {
  // installationId is the app-generated stable installation ID (from
  // expo-secure-store), supplied in the gateway path. Included here so the RPC
  // is self-contained when called without HTTP context.
  string installationId = 1;
  string pushToken = 2;
  // provider is 'expo' (default), 'fcm', or 'apns'.
  string provider = 3;
  // platform is 'ios' or 'android'.
  string platform = 4;
  string appId = 5;
  // environment is 'development', 'preview', or 'production'.
  string environment = 6;
  string appVersion = 7;
  string osVersion = 8;
  string locale = 9;
  string timezone = 10;
}

message UnregisterDeviceRequest {
  string installationId = 1;
}

// EmptyResponse is the empty reply for fire-and-forget RPCs (device
// register/unregister). The gateway maps it to 200 OK / 204 No Content.
message EmptyResponse {}

service Notifications {
  rpc CreateNotification(CreateNotificationRequest) returns (CreateNotificationResponse);
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse);
  rpc UpdateNotificationPreferences(UpdateNotificationPreferencesRequest) returns (UpdateNotificationPreferencesResponse);

  // Push device registration (see docs/push-notifications-design.md).
  rpc RegisterDevice(RegisterDeviceRequest) returns (EmptyResponse);
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (EmptyResponse);
}
